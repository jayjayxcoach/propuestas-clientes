<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#EAF0F7">
  <title>Esta toma no existe</title>
  <style>
    @font-face { font-family: "Inter"; font-weight: 500; font-display: swap; src: url("/assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url("/assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family: "Inter Tight"; font-weight: 800; font-display: swap; src: url("/assets/fonts/inter-tight-latin-800-normal.woff2") format("woff2"); }

    :root {
      color-scheme: light;
      --ink: #0E1A2B;
      --ink-3: #66758C;
      --pacific: #1F5BFF;
      --lagoon: #2EC5D3;
      --sun: #FFD66B;
      --mist: #EAF0F7;
      --rec: #FF3B30;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --display: -apple-system, BlinkMacSystemFont, "Inter Tight", "Inter", "Segoe UI", Roboto, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(70vmax 70vmax at 6% 0%, rgba(31,91,255,.45), transparent 60%),
        radial-gradient(60vmax 60vmax at 100% 20%, rgba(46,197,211,.50), transparent 60%),
        radial-gradient(60vmax 60vmax at 80% 105%, rgba(255,214,107,.50), transparent 60%),
        var(--mist);
      background-attachment: fixed;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 100svh;
      padding: 16px;
    }

    .stage { display: grid; place-items: center; }

    /* Visor de cámara */
    .vf {
      position: relative;
      width: min(980px, 100%);
      aspect-ratio: 16 / 10;
      border-radius: 30px;
      overflow: hidden;
      isolation: isolate;
      color: #fff;
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(40,70,130,.55), rgba(10,20,36,0) 60%),
        rgba(10, 20, 36, .86);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.25),
        0 40px 90px -40px rgba(10,30,80,.7),
        0 2px 10px -4px rgba(10,30,80,.3);
      display: grid;
      place-items: center;
    }
    /* Guías de tercios */
    .vf::before {
      content: "";
      position: absolute; inset: 0; z-index: -1;
      background:
        linear-gradient(90deg, transparent calc(33.33% - .5px), rgba(255,255,255,.07) calc(33.33% - .5px), rgba(255,255,255,.07) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.07) calc(66.66% - .5px), rgba(255,255,255,.07) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
        linear-gradient(180deg, transparent calc(33.33% - .5px), rgba(255,255,255,.07) calc(33.33% - .5px), rgba(255,255,255,.07) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.07) calc(66.66% - .5px), rgba(255,255,255,.07) calc(66.66% + .5px), transparent calc(66.66% + .5px));
    }
    /* Barras de color al pie */
    .vf::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
      background: linear-gradient(90deg,
        #E8E8E8 0 14.28%, #FFD66B 14.28% 28.57%, #2EC5D3 28.57% 42.85%, #34C759 42.85% 57.14%,
        #B65CFF 57.14% 71.42%, #FF3B30 71.42% 85.71%, #1F5BFF 85.71% 100%);
      opacity: .9;
    }

    .corner { position: absolute; width: 28px; height: 28px; border: 2px solid rgba(255,255,255,.85); }
    .c1 { top: 18px; left: 18px; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
    .c2 { top: 18px; right: 18px; border-left: 0; border-bottom: 0; border-top-right-radius: 6px; }
    .c3 { bottom: 24px; left: 18px; border-right: 0; border-top: 0; border-bottom-left-radius: 6px; }
    .c4 { bottom: 24px; right: 18px; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }

    .hud { position: absolute; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.88); display: flex; align-items: center; gap: 8px; }
    .hud-tl { top: 26px; left: 58px; }
    .hud-tc { top: 26px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.7); font-weight: 500; }
    .hud-tr { top: 26px; right: 58px; }
    .hud-bl { bottom: 32px; left: 58px; color: rgba(255,255,255,.7); font-weight: 500; }
    .hud-bc { bottom: 32px; left: 50%; transform: translateX(-50%); font-size: 15px; letter-spacing: .02em; }
    .hud-br { bottom: 32px; right: 58px; color: rgba(255,255,255,.7); font-weight: 500; }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 10px var(--rec); animation: blink 1.2s steps(2, start) infinite; }
    .batt { width: 24px; height: 12px; border: 1.5px solid rgba(255,255,255,.85); border-radius: 3px; position: relative; padding: 1.5px; }
    .batt::before { content: ""; display: block; width: 60%; height: 100%; background: #34C759; border-radius: 1px; }
    .batt::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; background: rgba(255,255,255,.85); border-radius: 0 1px 1px 0; }
    @keyframes blink { to { visibility: hidden; } }

    .focus {
      position: absolute; top: 50%; left: 50%;
      width: 74px; height: 74px;
      margin: -37px 0 0 -37px;
      border: 1.5px solid rgba(255,214,107,.55);
      border-radius: 10px;
      transform: translate(calc(min(980px, 100vw) * .34), -17vh);
      pointer-events: none;
    }

    .center { position: relative; text-align: center; padding: 0 24px; max-width: 640px; }
    .big {
      margin: 0;
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(110px, 22vw, 250px);
      line-height: .82;
      letter-spacing: -.07em;
      background: linear-gradient(180deg, #FFFFFF 20%, #9FDCFF 70%, #2EC5D3 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 10px 40px rgba(46,197,211,.35));
      padding-right: .07em;
    }
    h1 {
      margin: 22px 0 0;
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(28px, 4.2vw, 44px);
      letter-spacing: -.035em;
      line-height: 1.05;
    }
    .center p {
      margin: 14px auto 0;
      max-width: 40ch;
      font-size: clamp(15.5px, 1.7vw, 18px);
      line-height: 1.5;
      color: rgba(255,255,255,.72);
    }

    footer { padding: 18px 0 4px; text-align: center; font-size: 14px; color: var(--ink-3); }
    footer strong { color: var(--ink); font-family: var(--display); font-weight: 800; letter-spacing: -.02em; }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .vf { aspect-ratio: auto; min-height: calc(100svh - 80px); border-radius: 26px; }
      .corner { width: 20px; height: 20px; }
      .c1, .c2 { top: 14px; } .c1, .c3 { left: 14px; } .c2, .c4 { right: 14px; } .c3, .c4 { bottom: 20px; }
      .hud { font-size: 12px; }
      .hud-tl { top: 20px; left: 44px; } .hud-tr { top: 20px; right: 44px; }
      .hud-tc { top: 48px; }
      .hud-bl, .hud-br { display: none; }
      .hud-bc { bottom: 28px; font-size: 14px; }
      .focus { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="vf" role="img" aria-label="Visor de cámara grabando una escena vacía">
      <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
      <span class="hud hud-tl"><span class="rec-dot"></span>REC</span>
      <span class="hud hud-tc">Escena 404, toma 1</span>
      <span class="hud hud-tr">4K 24 <span class="batt" aria-hidden="true"></span></span>
      <span class="hud hud-bl">ISO 400 f/2.8</span>
      <span class="hud hud-bc" id="tc">00:00:00:00</span>
      <span class="hud hud-br">1/50</span>
      <span class="focus" aria-hidden="true"></span>

      <div class="center">
        <div class="big" aria-hidden="true">404</div>
        <h1>Esta toma no existe.</h1>
        <p>Aquí solo viven las propuestas que preparamos para cada cliente. Si te enviamos una, ábrela con el enlace que te llegó por WhatsApp.</p>
      </div>
    </div>
  </main>
  <footer><strong>jaypersonalbrand.com</strong></footer>

  <script>
    (function () {
      var el = document.getElementById("tc"), t0 = performance.now();
      function pad(n) { return (n < 10 ? "0" : "") + n; }
      function tick(now) {
        var t = (now - t0) / 1000;
        el.textContent = pad(Math.floor(t / 3600)) + ":" + pad(Math.floor(t / 60) % 60) + ":" + pad(Math.floor(t) % 60) + ":" + pad(Math.floor((t % 1) * 24));
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
